services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cardscanner
      POSTGRES_PASSWORD: cardscanner
      POSTGRES_DB: cardscanner
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - cardscanner_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardscanner"]
      interval: 3s
      retries: 10
volumes:
  cardscanner_pg: